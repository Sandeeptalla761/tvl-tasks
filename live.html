<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2f6b">
<title>Live Monitor — TVL Task Delegation</title>

<!--
  TVL TASK SYSTEM — live.html
  =====================================================================
  Read-only monitor. Live team view, open tasks, and weekly scores.

  Why this is a static page rather than part of the Apps Script web app:
  an Apps Script page that renders HTML needs a signed-in Google account,
  and a phone browser will not reliably give you one. This page is plain
  HTML on GitHub Pages and asks Apps Script only for JSON, so it opens in
  any browser, on any account, with no login at all.

  SETUP
    1. Set API_URL to your Apps Script /exec URL   (already filled in)
    2. Set KEY to DASH_KEY from the Config tab     (already filled in)
    3. Commit as live.html in the tvl-tasks repo

  The key is a shared secret. Anyone with the link can READ every task
  and score, so treat the URL like a password. Change DASH_KEY on the
  Config tab to invalidate every copy that is out there.

  Nothing here can write. Marking tasks done and assigning work stay in
  the signed-in dashboard on purpose.
-->

<style>
  :root{
    --navy:#1e2f6b; --navy2:#243a82; --blue:#2563eb;
    --green:#16a34a; --green-bg:#dcfce7; --green-tx:#166534;
    --amber:#f59e0b; --amber-bg:#fef3c7; --amber-tx:#92400e;
    --red:#dc2626;   --red-bg:#fee2e2;   --red-tx:#b91c1c;
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#eef1f8; --card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.45;padding-bottom:30px;}

  header{background:var(--navy);color:#fff;padding:13px 15px;
         display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:20;}
  header .logo{background:#fff;border-radius:9px;padding:5px;width:44px;height:44px;
        display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  header .logo img{max-width:100%;max-height:100%;display:block;}
  header .sys{font-size:15px;font-weight:800;line-height:1.2;}
  header .co{font-size:10px;color:#b9c4f0;letter-spacing:1.6px;margin-top:2px;}
  header .spacer{flex:1;}
  header .upd{font-size:10px;color:#b9c4f0;text-align:right;line-height:1.35;}

  .tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;
        position:sticky;top:70px;z-index:19;overflow-x:auto;}
  .tabs button{border:0;background:none;font:inherit;font-size:13px;font-weight:700;
        color:var(--muted);padding:13px 17px;cursor:pointer;
        border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs button.on{color:var(--navy);border-bottom-color:var(--blue);}

  .wrap{max-width:1100px;margin:0 auto;padding:13px;}

  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 9px;text-align:center;}
  .kpi .k{font-size:9px;letter-spacing:.6px;color:var(--muted);font-weight:800;}
  .kpi .v{font-size:22px;font-weight:800;color:var(--navy);margin-top:4px;}
  .kpi.g .v{color:var(--green-tx);} .kpi.a .v{color:var(--amber-tx);} .kpi.r .v{color:var(--red-tx);}

  .pcard{background:var(--card);border:1px solid var(--line);border-radius:13px;
         padding:13px 14px;border-left:5px solid var(--line);margin-bottom:10px;}
  .pcard.ok{border-left-color:var(--green);}
  .pcard.warn{border-left-color:var(--amber);}
  .pcard.bad{border-left-color:var(--red);}
  .pcard .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .pcard .nm{font-size:15px;font-weight:800;color:var(--navy);}
  .pcard .dp{font-size:10.5px;color:var(--muted);margin-top:1px;letter-spacing:.3px;}
  .pcard .sc{font-size:23px;font-weight:800;line-height:1;}
  .pcard .sc small{font-size:9px;font-weight:800;color:var(--muted);display:block;
        text-align:right;letter-spacing:.5px;margin-top:3px;}
  .pcard .nums{display:flex;gap:15px;margin-top:10px;flex-wrap:wrap;}
  .pcard .nums div{font-size:9.5px;color:var(--muted);font-weight:800;letter-spacing:.4px;}
  .pcard .nums b{display:block;font-size:17px;color:var(--ink);font-weight:800;
        letter-spacing:0;margin-bottom:1px;}
  .pcard .nums .r b{color:var(--red-tx);} .pcard .nums .g b{color:var(--green-tx);}
  .pcard .foot{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);
        font-size:11px;color:var(--muted);}
  .pcard .foot b{color:var(--red-tx);}

  .tcard{background:var(--card);border:1px solid var(--line);border-radius:13px;
         padding:12px 14px;margin-bottom:9px;}
  .tcard .t{font-size:14px;font-weight:600;line-height:1.35;}
  .tcard .who{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:5px;}
  .tcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .chip{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;
        background:#eef1f8;color:#42506e;letter-spacing:.2px;}
  .chip.late{background:var(--red-bg);color:var(--red-tx);}
  .chip.due{background:#e8effe;color:#1d4ed8;}
  .chip.rev{background:var(--amber-bg);color:var(--amber-tx);}
  .tcard .why{font-size:11px;color:var(--muted);margin-top:7px;font-style:italic;}

  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .filters select,.filters input{flex:1;min-width:130px;font:inherit;font-size:13px;
        padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;}

  .wknav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .wknav button{border:1px solid #cbd5e1;background:#fff;border-radius:9px;
        font:inherit;font-size:13px;font-weight:700;padding:9px 14px;cursor:pointer;}
  .wknav button:disabled{opacity:.45;}
  .wknav .lbl{flex:1;text-align:center;font-size:12.5px;font-weight:800;color:var(--navy);}

  .rank{display:flex;align-items:center;gap:11px;background:var(--card);
        border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:9px;}
  .rank .no{font-size:13px;font-weight:800;color:var(--muted);width:22px;text-align:center;}
  .rank .mid{flex:1;min-width:0;}
  .rank .nm{font-size:14px;font-weight:800;color:var(--navy);}
  .rank .sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .rank .bar{height:6px;border-radius:4px;background:#eef1f8;margin-top:7px;overflow:hidden;}
  .rank .bar i{display:block;height:100%;border-radius:4px;}
  .rank .sc{font-size:21px;font-weight:800;min-width:46px;text-align:right;}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;}
  .empty .big{font-size:40px;margin-bottom:10px;}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--navy);
        border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .btn{border:0;border-radius:10px;padding:12px 24px;font:inherit;font-size:14px;
       font-weight:700;color:#fff;background:var(--navy);cursor:pointer;}

  @media(min-width:760px){
    .kpis{grid-template-columns:repeat(6,1fr);}
    .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:11px;}
    .plist .pcard{margin-bottom:0;}
  }
</style>
</head>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbx9R5YC8AZfpvV4c1Lmk8Eq8al41zj5mbmlxI11NixcxJQNTpwTNdya61C8noPM_HGy/exec';
var KEY     = 'tvla661e70a7e232677';

/* The key may also be supplied in the URL, so one page can serve more
   than one system without being rebuilt. */
var qp = new URLSearchParams(location.search);
if (qp.get('k')) KEY = qp.get('k');

var TAB = 'team', WK = 0, TIMER = null, seq = 0, DOERS = [];

/* ---------- JSONP with retries. Apps Script answers by redirecting to
   googleusercontent, which a phone on a weak signal drops more often
   than a desktop does. ---------- */
function api(params, cb, onErr, attempt){
  attempt = attempt || 1;
  params.k = KEY;

  var name = 'tvl' + (++seq) + '_' + Date.now();
  var s = null, done = false;
  var timer = setTimeout(function(){ fail('timed out'); }, attempt === 1 ? 20000 : 30000);

  window[name] = function(res){
    if (done) return;
    done = true; clearTimeout(timer); cleanup(); cb(res);
  };

  function cleanup(){
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if (s && s.parentNode) s.parentNode.removeChild(s);
  }
  function fail(why){
    if (done) return;
    done = true; clearTimeout(timer); cleanup();
    if (attempt < 3){ setTimeout(function(){ api(params, cb, onErr, attempt + 1); }, attempt * 1200); return; }
    onErr && onErr(why);
  }

  var q = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]);
  }).join('&');

  s = document.createElement('script');
  s.referrerPolicy = 'no-referrer';
  s.src = API_URL + '?' + q + '&callback=' + name + '&_=' + Date.now();
  s.onerror = function(){ fail('blocked'); };
  document.body.appendChild(s);
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    TAB = b.dataset.tab;
    ['team','tasks','scores'].forEach(function(t){
      document.getElementById('tab-' + t).style.display = (t === TAB) ? '' : 'none';
    });
    refresh();
    resetTimer();
  });
});

function resetTimer(){
  if (TIMER) clearInterval(TIMER);
  /* Only the team view is worth polling; the other two are looked at
     deliberately rather than watched. */
  TIMER = setInterval(function(){ if (TAB === 'team') loadTeam(); }, 60000);
}

function refresh(){
  if (TAB === 'team')   loadTeam();
  if (TAB === 'tasks')  loadTasks();
  if (TAB === 'scores') loadScores();
}

/* ---------- team ---------- */
function loadTeam(){
  api({ api:'live' }, function(d){
    if (!d || !d.ok) return oops('teamBody', d);

    document.getElementById('upd').innerHTML =
      esc(d.date) + '<br>updated ' + esc(d.time);

    var t = d.totals;
    document.getElementById('kpis').innerHTML =
      kpi('DUE TODAY', t.dueToday, '') +
      kpi('DONE', t.doneToday, 'g') +
      kpi('DONE %', t.pct + '%', t.pct >= 75 ? 'g' : t.pct >= 40 ? 'a' : 'r') +
      kpi('OPEN', t.openNow, t.openNow ? 'a' : '') +
      kpi('OVERDUE', t.overdue, t.overdue ? 'r' : '') +
      kpi('BEHIND', t.atRisk + '/' + t.people, t.atRisk ? 'r' : 'g');

    if (!d.people.length) return empty('teamBody', 'Nobody active on the Doer List.');

    /* Fill the list of names for the task filter while we are here. */
    if (!DOERS.length){
      DOERS = d.people.map(function(p){ return p.name; });
      document.getElementById('fDoer').innerHTML =
        '<option value="">Everyone</option>' +
        DOERS.slice().sort().map(function(n){
          return '<option value="' + esc(n) + '">' + esc(n) + '</option>';
        }).join('');
    }

    document.getElementById('teamBody').innerHTML =
      '<div class="plist">' + d.people.map(personCard).join('') + '</div>';

  }, function(why){ oops('teamBody', null, why); });
}

function personCard(p){
  var cls = p.overdue ? 'bad' : (p.openNow ? 'warn' : 'ok');
  var col = p.score === null ? 'var(--muted)'
          : p.score >= 75 ? 'var(--green-tx)'
          : p.score >= 50 ? 'var(--amber-tx)' : 'var(--red-tx)';

  var foot = [];
  if (p.overdue)   foot.push('<b>' + p.overdue + ' overdue</b>' + (p.oldest ? ', oldest ' + p.oldest + 'd' : ''));
  if (p.upcoming)  foot.push(p.upcoming + ' coming up');
  if (p.lastAt)    foot.push('last closed ' + esc(p.lastAt));
  if (p.weekTasks) foot.push('week ' + p.weekDone + '/' + p.weekTasks + (p.revisions ? ', ' + p.revisions + ' rev' : ''));

  return '<div class="pcard ' + cls + '">' +
    '<div class="top"><div>' +
      '<div class="nm">' + esc(p.name) + '</div>' +
      (p.dept ? '<div class="dp">' + esc(p.dept) + '</div>' : '') +
    '</div><div class="sc" style="color:' + col + '">' +
      (p.score === null ? '\u2014' : p.score) + '<small>WEEK</small></div></div>' +
    '<div class="nums">' +
      '<div>TODAY<b>' + p.dueToday + '</b></div>' +
      '<div class="g">DONE<b>' + p.doneToday + '</b></div>' +
      '<div>OPEN<b>' + p.openNow + '</b></div>' +
      '<div class="r">LATE<b>' + p.overdue + '</b></div>' +
    '</div>' +
    (foot.length ? '<div class="foot">' + foot.join('  \u00b7  ') + '</div>' : '') +
  '</div>';
}

/* ---------- open tasks ---------- */
['fScope','fDoer'].forEach(function(id){
  document.getElementById(id).addEventListener('change', loadTasks);
});
var qTimer;
document.getElementById('fQ').addEventListener('input', function(){
  clearTimeout(qTimer); qTimer = setTimeout(loadTasks, 400);
});

function loadTasks(){
  document.getElementById('tasksBody').innerHTML = '<div class="empty"><div class="spin"></div>Loading…</div>';

  api({ api:'pending',
        scope: document.getElementById('fScope').value,
        doer : document.getElementById('fDoer').value,
        q    : document.getElementById('fQ').value },
    function(d){
      if (!d || !d.ok) return oops('tasksBody', d);
      if (!d.rows.length) return empty('tasksBody', 'Nothing matches these filters.', '\ud83c\udf89');

      document.getElementById('tasksBody').innerHTML =
        '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">' +
          d.shown + ' shown of ' + d.total + ' open</div>' +
        d.rows.map(function(r){
          return '<div class="tcard">' +
            '<div class="who">' + esc(r.doer) + '</div>' +
            '<div class="t">' + esc(r.task) + '</div>' +
            '<div class="meta">' +
              '<span class="chip">' + esc(r.type) + '</span>' +
              '<span class="chip ' + (r.late ? 'late' : 'due') + '">Due ' + esc(r.due) +
                (r.late ? ' \u00b7 ' + r.late + 'd late' : '') + '</span>' +
              (r.revisions ? '<span class="chip rev">Revision ' + r.revisions + '</span>' : '') +
            '</div>' +
            (r.lastReason ? '<div class="why">Last reason: ' + esc(r.lastReason) + '</div>' : '') +
          '</div>';
        }).join('');
    },
    function(why){ oops('tasksBody', null, why); });
}

/* ---------- scores ---------- */
document.getElementById('wkPrev').addEventListener('click', function(){ WK--; loadScores(); });
document.getElementById('wkNext').addEventListener('click', function(){ if (WK < 0){ WK++; loadScores(); } });

function loadScores(){
  document.getElementById('scoresBody').innerHTML = '<div class="empty"><div class="spin"></div>Loading…</div>';

  api({ api:'scores', w: WK }, function(d){
    if (!d || !d.ok) return oops('scoresBody', d);

    document.getElementById('wkLabel').textContent = d.label + (d.offset === 0 ? '  (this week)' : '');
    document.getElementById('wkNext').disabled = d.offset >= 0;

    var t = d.totals;
    var h = '<div class="kpis" style="grid-template-columns:repeat(3,1fr)">' +
      kpi('AVERAGE', t.avg, t.avg >= 75 ? 'g' : t.avg >= 50 ? 'a' : 'r') +
      kpi('TASKS', t.tasks, '') +
      kpi('COMPLETED', t.completed, 'g') +
    '</div>';

    if (!d.scored.length && !d.idle.length) return empty('scoresBody', 'Nobody has tasks in this week.');

    h += d.scored.map(function(r, i){
      var col = r.score >= 75 ? 'var(--green-tx)' : r.score >= 50 ? 'var(--amber-tx)' : 'var(--red-tx)';
      var sub = r.completed + '/' + r.total + ' done' +
                (r.revisions ? ' \u00b7 ' + r.revisions + ' rev' : '') +
                (r.overdue ? ' \u00b7 ' + r.overdue + ' overdue' : '');
      return '<div class="rank">' +
        '<div class="no">' + (i + 1) + '</div>' +
        '<div class="mid">' +
          '<div class="nm">' + esc(r.name) + '</div>' +
          '<div class="sub">' + sub + '</div>' +
          '<div class="bar"><i style="width:' + r.score + '%;background:' + col + '"></i></div>' +
        '</div>' +
        '<div class="sc" style="color:' + col + '">' + r.score + '</div>' +
      '</div>';
    }).join('');

    if (d.idle.length){
      h += '<div style="font-size:11.5px;color:var(--muted);margin-top:14px;font-style:italic">' +
'No tasks dated in this week: ' + d.idle.map(function(r){ return esc(r.name); }).join(', ') +
           '</div>';
    }

    document.getElementById('scoresBody').innerHTML = h;

  }, function(why){ oops('scoresBody', null, why); });
}

/* ---------- helpers ---------- */
function kpi(k, v, cls){
  return '<div class="kpi ' + cls + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

function empty(id, msg, icon){
  document.getElementById(id).innerHTML =
    '<div class="empty">' + (icon ? '<div class="big">' + icon + '</div>' : '') + esc(msg) + '</div>';
}

function oops(id, res, why){
  var msg = (res && res.message) ? res.message
          : 'Could not reach the server (' + (why || 'unknown') + ').';
  document.getElementById(id).innerHTML =
    '<div class="empty"><div class="big">&#9888;</div>' + esc(msg) +
    '<p style="margin-top:16px"><button class="btn" id="rt">Retry</button></p></div>';
  var b = document.getElementById('rt');
  if (b) b.addEventListener('click', refresh);
}

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

refresh();
resetTimer();
</script>
