<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --navy:#1e2f6b; --navy2:#243a82; --blue:#2563eb;
    --green:#16a34a; --green-bg:#dcfce7; --green-tx:#166534;
    --amber:#f59e0b; --amber-bg:#fef3c7; --amber-tx:#92400e;
    --red:#dc2626;   --red-bg:#fee2e2;   --red-tx:#b91c1c;
    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; --bg:#eef1f8; --card:#fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink);}

  .topbar{background:var(--navy);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:14px;
        position:relative;}
  .topbar .side{flex:0 0 auto;display:flex;align-items:center;gap:11px;}
  .topbar .brand{line-height:1.25;}
  .topbar .mid{flex:1;text-align:center;min-width:0;}
  .topbar .sys{font-size:21px;font-weight:800;letter-spacing:.3px;line-height:1.15;}
  .topbar .co{font-size:14px;font-weight:700;}
  .topbar .tag{font-size:9px;letter-spacing:2.5px;color:#b9c4f0;margin-top:2px;}
  .topbar .logo{background:#fff;border-radius:10px;padding:6px;width:54px;height:54px;
       display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .topbar .logo img{max-width:100%;max-height:100%;display:block;}
  /* matched to the left block's width at runtime, so the heading sits on
     the true centre of the page rather than the centre of what is left */
  .topbar .side.ghost{width:54px;visibility:hidden;}
  .topbar .spacer{flex:1;}
  .dry{background:var(--amber-bg);color:var(--amber-tx);font-size:11px;font-weight:700;
       padding:5px 11px;border-radius:999px;position:absolute;right:22px;top:50%;
       transform:translateY(-50%);}

  .tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 14px;
        position:sticky;top:0;z-index:10;overflow-x:auto;}
  .tabs button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;
        color:var(--muted);padding:15px 20px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs button.on{color:var(--navy);border-bottom-color:var(--blue);}

  .wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        box-shadow:0 1px 3px rgba(20,30,70,.06);margin-bottom:16px;}
  .card h2{font-size:14px;letter-spacing:.5px;margin:0;padding:15px 18px;
        border-bottom:1px solid var(--line);color:var(--navy);}
  .card .body{padding:18px;}

  label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin:0 0 6px;}
  input,select,textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;
        border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:76px;}
  .fld{margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;}
  .hide{display:none !important;}

  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg button{font:inherit;font-size:13px;font-weight:600;padding:10px 18px;border-radius:9px;
        border:1px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;}
  .seg button.on{background:var(--navy);color:#fff;border-color:var(--navy);
        box-shadow:0 0 0 3px rgba(37,99,235,.18);}

  .btn{font:inherit;font-size:14px;font-weight:700;padding:11px 20px;border-radius:9px;
       border:1px solid #cbd5e1;background:#fff;color:var(--ink);cursor:pointer;}
  .btn:hover{background:#f8fafc;}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:var(--navy2);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.sm{font-size:12px;padding:7px 13px;}
  .btn.done{color:var(--green-tx);border-color:#bbf0cd;}
  .btn.rev{color:var(--amber-tx);border-color:#f0dfb0;}

  .hint{font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:16px;}
  .msg{margin-top:14px;font-size:13px;font-weight:600;min-height:18px;}
  .msg.ok{color:var(--green-tx);} .msg.err{color:var(--red-tx);}

  table{width:100%;border-collapse:collapse;}
  th{font-size:10.5px;letter-spacing:.5px;color:var(--muted);text-align:left;padding:11px 12px;
     border-bottom:1px solid var(--line);white-space:nowrap;}
  td{font-size:13px;padding:11px 12px;border-bottom:1px solid #f1f3f9;vertical-align:top;}
  td .nm{font-weight:700;color:var(--navy);}
  td .sub{font-size:11px;color:var(--muted);margin-top:2px;}

  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
  .pill.daily{background:#eef1f8;color:#42506e;}
  .pill.recurring{background:#e8effe;color:#1d4ed8;}
  .pill.onetime{background:#f3e8ff;color:#6b21a8;}
  .pill.late{background:var(--red-bg);color:var(--red-tx);}
  .pill.rev{background:var(--amber-bg);color:var(--amber-tx);}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .kpi .k{font-size:10px;letter-spacing:.8px;color:var(--muted);font-weight:700;}
  .kpi .v{font-size:27px;font-weight:800;color:var(--navy);margin-top:6px;}
  .kpi.g .v{color:var(--green-tx);} .kpi.a .v{color:var(--amber-tx);} .kpi.r .v{color:var(--red-tx);}

  .bar{height:26px;border-radius:7px;background:#f1f3f9;overflow:hidden;position:relative;min-width:120px;}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;}
  .bar span{position:relative;z-index:1;font-size:12px;font-weight:800;line-height:26px;padding-left:9px;}

  .empty{padding:44px;text-align:center;color:var(--muted);font-size:14px;}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--navy);
        border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px;}
  @keyframes sp{to{transform:rotate(360deg);}}

  .modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;
         align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal.on{display:flex;}
  .modal .box{background:#fff;border-radius:14px;width:100%;max-width:430px;padding:20px;}
  .modal h3{margin:0 0 4px;font-size:16px;color:var(--navy);}
  .modal .t{font-size:13px;color:var(--muted);margin-bottom:16px;}
  .modal .row{display:flex;gap:10px;margin-top:6px;}
  .modal .row .btn{flex:1;}

  .toast{position:fixed;left:50%;transform:translateX(-50%) translateY(12px);bottom:22px;
         background:#111827;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;
         opacity:0;transition:.2s;z-index:60;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.good{background:var(--green-tx);} .toast.bad{background:var(--red-tx);}

  /* ---- live team view ---- */
  .livebar{display:flex;align-items:center;justify-content:space-between;gap:12px;
        background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:13px 16px;margin-bottom:14px;}
  .livebar .lt{font-size:15px;font-weight:800;color:var(--navy);}
  .livebar .ls{font-size:12px;color:var(--muted);margin-top:2px;}

  .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px 15px;border-left:5px solid var(--line);}
  .pcard.ok{border-left-color:var(--green);}
  .pcard.warn{border-left-color:var(--amber);}
  .pcard.bad{border-left-color:var(--red);}
  .pcard .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .pcard .nm{font-size:15px;font-weight:800;color:var(--navy);}
  .pcard .dp{font-size:11px;color:var(--muted);margin-top:1px;}
  .pcard .sc{font-size:22px;font-weight:800;}
  .pcard .sc small{font-size:10px;font-weight:700;color:var(--muted);display:block;
        text-align:right;letter-spacing:.5px;}
  .pcard .nums{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap;}
  .pcard .nums div{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
  .pcard .nums b{display:block;font-size:17px;color:var(--ink);font-weight:800;
        letter-spacing:0;margin-bottom:1px;}
  .pcard .nums .r b{color:var(--red-tx);}
  .pcard .nums .g b{color:var(--green-tx);}
  .pcard .foot{margin-top:11px;padding-top:9px;border-top:1px solid var(--line);
        font-size:11px;color:var(--muted);}
  .pcard .foot b{color:var(--red-tx);}

  /* On a phone a six-column table is unreadable, so each row folds into
     a stacked card with its own labels. No second markup path to keep
     in step: the same <td> cells are relabelled by CSS. */
  @media(max-width:700px){
    #pendBody table, #pendBody thead, #pendBody tbody,
    #pendBody th, #pendBody td, #pendBody tr{display:block;}
    #pendBody thead{position:absolute;left:-9999px;}
    #pendBody tr{background:var(--card);border:1px solid var(--line);
        border-radius:12px;margin-bottom:11px;padding:11px 13px;}
    #pendBody td{border:0;padding:4px 0;font-size:13px;}
    #pendBody td:before{content:attr(data-l);display:block;font-size:10px;
        font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:2px;}
    #pendBody td:first-child:before{display:none;}
    #pendBody td:last-child{padding-top:10px;}

    #scoreBody table, #scoreBody thead, #scoreBody tbody,
    #scoreBody th, #scoreBody td, #scoreBody tr{display:block;}
    #scoreBody thead{position:absolute;left:-9999px;}
    #scoreBody tr{background:var(--card);border:1px solid var(--line);
        border-radius:12px;margin-bottom:11px;padding:11px 13px;}
    #scoreBody td{border:0;padding:3px 0;font-size:13px;}
    #scoreBody td:before{content:attr(data-l) ' ';font-size:10px;font-weight:700;
        letter-spacing:.5px;color:var(--muted);}
    #scoreBody td:first-child:before{content:'';}

    .plist{grid-template-columns:1fr;}
    .kpis{grid-template-columns:repeat(2,1fr);}
    .kpi .v{font-size:22px;}
    .livebar{padding:11px 13px;}
    .topbar .sys{font-size:15px;}
    .topbar .co{font-size:11px;}
    .topbar .tag{display:none;}
    .topbar .logo{width:42px;height:42px;}
    .topbar .side.ghost{display:none;}
    .topbar .mid{text-align:right;}
    .topbar{padding:12px 14px;}
    .dry{right:14px;font-size:10px;padding:4px 8px;}
    .hide-sm{display:none;}
    .card .body{padding:14px;}
  }
</style>
</head>

  <div id="tab-score" class="hide">
    <div class="card">
      <div class="body" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <button class="btn" id="prevWk">&larr; Earlier</button>
        <div style="font-weight:700;color:var(--navy);" id="wkLabel">…</div>
        <button class="btn" id="nextWk">Later &rarr;</button>
      </div>
    </div>
    <div class="kpis" id="scoreKpis"></div>
    <div class="card">
      <h2>SCORE BY PERSON</h2>
      <div id="scoreBody"><div class="empty"><div class="spin"></div>Loading…</div></div>
    </div>
  </div>

</div>

<!-- revise dialog -->
<div class="modal" id="revModal">
  <div class="box">
    <h3>Move this task</h3>
    <div class="t" id="revTask"></div>
    <div class="fld"><label>WHY</label><select id="revReason"></select></div>
    <div class="fld"><label>NEW DATE</label><input type="date" id="revDate"></div>
    <div class="fld"><label>IN YOUR OWN WORDS</label>
      <textarea id="revNote" maxlength="200" style="min-height:56px"></textarea></div>
    <div class="row">
      <button class="btn" id="revCancel">Cancel</button>
      <button class="btn primary" id="revSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var BOOT = null, PEND = null, WKOFF = 0, TYPE = 'RECURRING', REVKEY = null;

var HINTS = {
  DAILY    : 'Runs every working day from the start date. One reminder the working day before, no revisions, because it comes round again tomorrow.',
  RECURRING: 'Repeats on the pattern you choose. Reminded the working day before, then every day until it is closed. Up to 3 revisions, each costing 25 points.',
  ONETIME  : 'Sent to the person the moment you create it, then every working day until it is closed. Up to 3 revisions.'
};

/* ---------- boot ---------- */
google.script.run.withSuccessHandler(function(b){
  BOOT = b;
  document.getElementById('co').textContent = b.company;
  if (b.dryRun) document.getElementById('dryFlag').classList.remove('hide');

  var opts = '<option value="">Choose a person…</option>' + b.doers.map(function(d){
    return '<option value="' + esc(d.name) + '">' + esc(d.name) + (d.dept ? ' — ' + esc(d.dept) : '') + '</option>';
  }).join('');
  document.getElementById('doer').innerHTML = opts;
  document.getElementById('fDoer').innerHTML =
    '<option value="">Everyone</option>' + b.doers.map(function(d){
      return '<option value="' + esc(d.name) + '">' + esc(d.name) + '</option>';
    }).join('');

  document.getElementById('freq').innerHTML = b.frequencies.map(function(f){
    return '<option value="' + esc(f.code) + '">' + esc(f.label) + '</option>';
  }).join('');

  document.getElementById('revReason').innerHTML = (b.reasons || []).map(function(r,i){
    return '<option value="' + i + '">' + esc(r) + '</option>';
  }).join('');

  document.getElementById('start').value = b.today;
  document.getElementById('due').value   = b.today;

  if (!b.canAssign){
    document.getElementById('addBtn').disabled = true;
    setMsg('addMsg', 'Your account is not marked Admin or HOD on the Doer List, so you cannot create tasks.', 'err');
  }
  setType('RECURRING');
  loadLive();
  startLiveTimer(true);
}).withFailureHandler(function(e){ toast(e.message, 'bad'); }).tvlDashBootstrap();

/* ---------- tabs ---------- */
document.querySelectorAll('.tabs button').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    ['live','add','pending','score'].forEach(function(t){
      document.getElementById('tab-' + t).classList.toggle('hide', t !== b.dataset.tab);
    });
    if (b.dataset.tab === 'pending' && !PEND) loadPending();
    if (b.dataset.tab === 'score') loadScores();
    if (b.dataset.tab === 'live') loadLive();
    startLiveTimer(b.dataset.tab === 'live');
  });
});

/* ---------- live team view ---------- */
var LIVE_T = null;

function startLiveTimer(on){
  if (LIVE_T){ clearInterval(LIVE_T); LIVE_T = null; }
  /* Only while the tab is in front. A timer left running behind another
     tab just burns quota for a screen nobody is looking at. */
  if (on) LIVE_T = setInterval(loadLive, 60000);
}

document.getElementById('liveRefresh').addEventListener('click', loadLive);

function loadLive(){
  google.script.run.withSuccessHandler(function(d){
    document.getElementById('liveDate').textContent =
      d.date + (d.working ? '' : '  (non-working day)');
    document.getElementById('liveMeta').textContent =
      'Week ' + d.week + '  \u00b7  updated ' + d.time;

    var t = d.totals;
    document.getElementById('liveKpis').innerHTML =
      kpi('DUE TODAY', t.dueToday, '') +
      kpi('COMPLETED', t.doneToday, 'g') +
      kpi('DONE %', t.pct + '%', t.pct >= 75 ? 'g' : t.pct >= 40 ? 'a' : 'r') +
      kpi('STILL OPEN', t.openNow, t.openNow ? 'a' : '') +
      kpi('OVERDUE', t.overdue, t.overdue ? 'r' : '') +
      kpi('PEOPLE BEHIND', t.atRisk + '/' + t.people, t.atRisk ? 'r' : 'g');

    if (!d.people.length){
      document.getElementById('liveBody').innerHTML =
        '<div class="empty">Nobody active on the Doer List.</div>';
      return;
    }

    document.getElementById('liveBody').innerHTML =
      '<div class="plist">' + d.people.map(personCard).join('') + '</div>';

  }).withFailureHandler(function(e){
    document.getElementById('liveBody').innerHTML =
      '<div class="empty">' + esc(e.message) + '</div>';
  }).tvlDashLive();
}

function personCard(p){
  var cls = p.overdue ? 'bad' : (p.openNow ? 'warn' : 'ok');
  var col = p.score === null ? 'var(--muted)'
          : p.score >= 75 ? 'var(--green-tx)'
          : p.score >= 50 ? 'var(--amber-tx)' : 'var(--red-tx)';

  var foot = [];
  if (p.overdue)  foot.push('<b>' + p.overdue + ' overdue</b>' +
                            (p.oldest ? ', oldest ' + p.oldest + 'd' : ''));
  if (p.upcoming) foot.push(p.upcoming + ' coming up');
  if (p.lastAt)   foot.push('last closed ' + p.lastAt);
  if (p.weekTasks) foot.push('week ' + p.weekDone + '/' + p.weekTasks +
                             (p.revisions ? ', ' + p.revisions + ' rev' : ''));

  return '<div class="pcard ' + cls + '">' +
    '<div class="top">' +
      '<div><div class="nm">' + esc(p.name) + '</div>' +
        (p.dept ? '<div class="dp">' + esc(p.dept) + '</div>' : '') + '</div>' +
      '<div class="sc" style="color:' + col + '">' +
        (p.score === null ? '\u2014' : p.score) +
        '<small>WEEK SCORE</small></div>' +
    '</div>' +
    '<div class="nums">' +
      '<div>TODAY<b>' + p.dueToday + '</b></div>' +
      '<div class="g">DONE<b>' + p.doneToday + '</b></div>' +
      '<div>OPEN<b>' + p.openNow + '</b></div>' +
      '<div class="r">LATE<b>' + p.overdue + '</b></div>' +
    '</div>' +
    (foot.length ? '<div class="foot">' + foot.join('  \u00b7  ') + '</div>' : '') +
  '</div>';
}

/* ---------- add ---------- */
document.getElementById('typeSeg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  setType(b.dataset.t);
});

function setType(t){
  TYPE = t;
  setMsg('addMsg', '', '');
  document.querySelectorAll('#typeSeg button').forEach(function(x){
    x.classList.toggle('on', x.dataset.t === t);
  });
  document.getElementById('typeHint').textContent = HINTS[t];
  document.getElementById('freqWrap').classList.toggle('hide', t !== 'RECURRING');
  document.getElementById('startWrap').classList.toggle('hide', t === 'ONETIME');
  document.getElementById('endWrap').classList.toggle('hide', t === 'ONETIME');
  document.getElementById('dueWrap').classList.toggle('hide', t !== 'ONETIME');
}

['doer','task','freq','start','end','due','pri'].forEach(function(id){
  var el = document.getElementById(id);
  if (el) el.addEventListener('input', function(){ setMsg('addMsg', '', ''); });
});

document.getElementById('addBtn').addEventListener('click', function(){
  var btn = this;
  var form = {
    type : TYPE,
    doer : document.getElementById('doer').value,
    task : document.getElementById('task').value.trim(),
    freq : document.getElementById('freq').value,
    start: document.getElementById('start').value,
    end  : document.getElementById('end').value,
    due  : document.getElementById('due').value,
    priority: document.getElementById('pri').value
  };
  if (!form.doer || !form.task){ setMsg('addMsg', 'Choose a person and describe the task.', 'err'); return; }

  btn.disabled = true; btn.textContent = 'Creating…';
  setMsg('addMsg', '', '');

  google.script.run.withSuccessHandler(function(r){
    btn.disabled = false; btn.textContent = 'Create task';
    setMsg('addMsg', r.message, r.ok ? 'ok' : 'err');

    if (!r.ok) return;

    document.getElementById('task').value = '';
    PEND = null;
    toast(r.message, 'good');

    /* The task is saved by now. The WhatsApp to the doer and the copy to
       whoever is on ASSIGN_NOTIFY both go out on a second call, so the
       form is not held up by two round trips to Meta. */
    if (r.sendRow || r.notify){
      google.script.run.withSuccessHandler(function(s){
        setMsg('addMsg', r.taskId + ' \u2014 ' + s.message, s.ok ? 'ok' : 'err');
        loadLive();
      }).withFailureHandler(function(e){
        setMsg('addMsg', r.taskId + ' saved, but the follow-up failed: ' + e.message, 'err');
      }).tvlDashSendNow(r.sendRow || 0, r.doer, r.notify || null);
    }
  }).withFailureHandler(function(e){
    btn.disabled = false; btn.textContent = 'Create task';
    setMsg('addMsg', e.message, 'err');
  }).tvlDashAdd(form);
});

/* ---------- pending ---------- */
['fDoer','fType','fScope'].forEach(function(id){
  document.getElementById(id).addEventListener('change', loadPending);
});
var qTimer;
document.getElementById('fQ').addEventListener('input', function(){
  clearTimeout(qTimer); qTimer = setTimeout(loadPending, 350);
});
document.getElementById('refreshBtn').addEventListener('click', loadPending);
document.getElementById('genBtn').addEventListener('click', function(){
  var b = this; b.disabled = true; b.textContent = 'Generating…';
  google.script.run.withSuccessHandler(function(r){
    b.disabled = false; b.textContent = 'Generate schedule';
    toast(r.message, 'good'); loadPending();
  }).withFailureHandler(function(e){
    b.disabled = false; b.textContent = 'Generate schedule';
    toast(e.message, 'bad');
  }).tvlDashGenerate();
});

function loadPending(){
  document.getElementById('pendBody').innerHTML = '<div class="empty"><div class="spin"></div>Loading…</div>';
  google.script.run.withSuccessHandler(function(res){
    PEND = res;
    document.getElementById('pendHead').textContent =
      'OPEN TASKS — ' + res.shown + ' shown of ' + res.total + ' open';

    if (!res.rows.length){
      document.getElementById('pendBody').innerHTML =
        '<div class="empty">Nothing matches these filters.</div>';
      return;
    }

    var h = '<div style="overflow-x:auto"><table><thead><tr>' +
      '<th>PERSON</th><th>TASK</th><th>TYPE</th><th>DUE</th><th>REV</th><th></th>' +
      '</tr></thead><tbody>';

    res.rows.forEach(function(r){
      h += '<tr>' +
        '<td data-l="PERSON"><div class="nm">' + esc(r.doer) + '</div><div class="sub">' + esc(r.taskId) + '</div></td>' +
        '<td data-l="TASK">' + esc(r.task) +
          (r.lastReason ? '<div class="sub">Last reason: ' + esc(r.lastReason) + '</div>' : '') + '</td>' +
        '<td data-l="TYPE"><span class="pill ' + r.type.toLowerCase() + '">' + esc(r.type) + '</span></td>' +
        '<td data-l="DUE">' + esc(r.due) + (r.late ? '<div><span class="pill late">' + r.late + 'd late</span></div>' : '') + '</td>' +
        '<td data-l="REVISIONS">' + (r.revisions ? '<span class="pill rev">' + r.revisions + '</span>' : '0') + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="btn sm done" data-done="' + esc(r.key) + '">Done</button> ' +
          (r.canRevise
            ? '<button class="btn sm rev" data-rev="' + esc(r.key) + '" data-task="' + esc(r.task) + '">Move</button>'
            : '') +
        '</td></tr>';
    });

    h += '</tbody></table></div>';
    if (res.capped) h += '<div class="empty">Showing the first 300. Narrow the filters to see the rest.</div>';
    document.getElementById('pendBody').innerHTML = h;
    wirePending();

  }).withFailureHandler(function(e){
    document.getElementById('pendBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }).tvlDashPending({
    doer : document.getElementById('fDoer').value,
    type : document.getElementById('fType').value,
    scope: document.getElementById('fScope').value,
    q    : document.getElementById('fQ').value
  });
}

function wirePending(){
  document.querySelectorAll('[data-done]').forEach(function(b){
    b.addEventListener('click', function(){
      b.disabled = true; b.textContent = '…';
      google.script.run.withSuccessHandler(function(r){
        toast(r.message, r.ok ? 'good' : 'bad');
        if (r.ok) b.closest('tr').remove(); else { b.disabled = false; b.textContent = 'Done'; }
      }).withFailureHandler(function(e){
        b.disabled = false; b.textContent = 'Done'; toast(e.message, 'bad');
      }).tvlDashDone(b.dataset.done);
    });
  });

  document.querySelectorAll('[data-rev]').forEach(function(b){
    b.addEventListener('click', function(){
      REVKEY = b.dataset.rev;
      document.getElementById('revTask').textContent = b.dataset.task;
      document.getElementById('revNote').value = '';
      document.getElementById('revReason').selectedIndex = 0;
      var d = new Date(); d.setDate(d.getDate() + 1);
      document.getElementById('revDate').value = d.toISOString().slice(0, 10);
      document.getElementById('revModal').classList.add('on');
    });
  });
}

document.getElementById('revCancel').addEventListener('click', function(){
  document.getElementById('revModal').classList.remove('on');
});

document.getElementById('revSave').addEventListener('click', function(){
  var b = this;
  var date = document.getElementById('revDate').value;
  if (!date){ toast('Pick the new date', 'bad'); return; }

  b.disabled = true; b.textContent = 'Saving…';
  google.script.run.withSuccessHandler(function(r){
    b.disabled = false; b.textContent = 'Save';
    document.getElementById('revModal').classList.remove('on');
    toast(r.message, r.ok ? 'good' : 'bad');
    loadPending();
  }).withFailureHandler(function(e){
    b.disabled = false; b.textContent = 'Save'; toast(e.message, 'bad');
  }).tvlDashRevise(REVKEY,
      document.getElementById('revReason').value,
      document.getElementById('revNote').value,
      date);
});

/* ---------- scores ---------- */
document.getElementById('prevWk').addEventListener('click', function(){ WKOFF--; loadScores(); });
document.getElementById('nextWk').addEventListener('click', function(){ if (WKOFF < 0){ WKOFF++; loadScores(); } });

function loadScores(){
  document.getElementById('scoreBody').innerHTML = '<div class="empty"><div class="spin"></div>Loading…</div>';
  google.script.run.withSuccessHandler(function(s){
    document.getElementById('wkLabel').textContent =
      s.label + (s.offset === 0 ? '  (this week)' : '');
    document.getElementById('nextWk').disabled = s.offset >= 0;

    var t = s.totals;
    document.getElementById('scoreKpis').innerHTML =
      kpi('COMPANY AVERAGE', t.avg + '/100', t.avg >= 75 ? 'g' : t.avg >= 50 ? 'a' : 'r') +
      kpi('TASKS', t.tasks, '') +
      kpi('COMPLETED', t.completed, 'g') +
      kpi('REVISIONS', t.revisions, 'a') +
      kpi('OVERDUE OPEN', t.overdue, t.overdue ? 'r' : '') +
      kpi('LAPSED', t.lapsed, t.lapsed ? 'r' : '');

    if (!s.scored.length && !s.idle.length){
      document.getElementById('scoreBody').innerHTML = '<div class="empty">Nobody has tasks in this week.</div>';
      return;
    }

    var h = '<div style="overflow-x:auto"><table><thead><tr>' +
      '<th>PERSON</th><th>SCORE</th><th>TASKS</th><th>DONE</th>' +
      '<th class="hide-sm">FIRST TIME</th><th>REV</th><th class="hide-sm">OPEN</th><th>OVERDUE</th>' +
      '</tr></thead><tbody>';

    s.scored.forEach(function(r, i){
      var col = r.score >= 75 ? 'var(--green)' : r.score >= 50 ? 'var(--amber)' : 'var(--red)';
      h += '<tr>' +
        '<td><div class="nm">' + (i + 1) + '. ' + esc(r.name) + '</div>' +
          (r.dept ? '<div class="sub">' + esc(r.dept) + '</div>' : '') + '</td>' +
        '<td data-l="SCORE"><div class="bar"><i style="width:' + r.score + '%;background:' + col + ';opacity:.25"></i>' +
          '<span style="color:' + col + '">' + r.score + '</span></div></td>' +
        '<td data-l="TASKS">' + r.total + '</td>' +
        '<td data-l="COMPLETED">' + r.completed + '</td>' +
        '<td class="hide-sm" data-l="FIRST TIME">' + (r.onTimePct === null ? '—' : r.onTimePct + '%') + '</td>' +
        '<td data-l="REVISIONS">' + r.revisions + '</td>' +
        '<td class="hide-sm" data-l="OPEN">' + r.open + '</td>' +
        '<td data-l="OVERDUE">' + (r.overdue ? '<span class="pill late">' + r.overdue + '</span>' : '0') + '</td>' +
        '</tr>';
    });

    s.idle.forEach(function(r){
      h += '<tr style="background:#fafbfd;color:var(--muted)">' +
        '<td><div class="nm" style="color:var(--muted)">' + esc(r.name) + '</div></td>' +
        '<td colspan="6" style="font-style:italic">No tasks dated in this week — not scored</td>' +
        '<td>' + (r.overdue ? '<span class="pill late">' + r.overdue + '</span>' : '0') + '</td>' +
        '</tr>';
    });

    h += '</tbody></table></div>' +
      '<div class="empty" style="padding:14px;font-size:12px;text-align:left">' +
      '100 = finished on the first date it was set for. Each revision costs 25. ' +
      'People with nothing dated in the week are listed but not scored, so a quiet week ' +
      'neither helps nor hurts the average.</div>';

    document.getElementById('scoreBody').innerHTML = h;

  }).withFailureHandler(function(e){
    document.getElementById('scoreBody').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }).tvlDashScores(WKOFF);
}

function kpi(k, v, cls){
  return '<div class="kpi ' + cls + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

/* Keep the heading on the true centre: the spacer on the right is set
   to whatever the logo-and-company block measures. */
function balanceHeader(){
  var left  = document.querySelector('.topbar .side');
  var ghost = document.querySelector('.topbar .side.ghost');
  if (left && ghost && window.innerWidth > 700) ghost.style.width = left.offsetWidth + 'px';
}
window.addEventListener('resize', balanceHeader);
setTimeout(balanceHeader, 60);

/* ---------- helpers ---------- */
function setMsg(id, txt, cls){
  var e = document.getElementById(id);
  e.textContent = txt; e.className = 'msg ' + (cls || '');
}

function toast(msg, kind){
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (kind || '');
  setTimeout(function(){ t.className = 'toast ' + (kind || ''); }, 3200);
}

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
</script>
</body>
</html>
